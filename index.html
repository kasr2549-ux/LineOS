<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineOS Proxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: white;
            overflow: hidden;
        }

        /* Fancy Header */
        .header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(45deg, #1a1a1a, #2c2c2c);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(to right, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* Search Bar Area */
        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }

        input[type="text"] {
            width: 50%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #444;
            background-color: #222;
            color: white;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00dbde;
        }

        button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(to right, #00dbde, #fc00ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Browser Frame */
        .browser-area {
            width: 100%;
            height: calc(100vh - 160px);
            border: none;
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">LineOS</div>
        <div class="search-container">
            <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://wikipedia.org)">
            <button onclick="loadPage()">Go</button>
        </div>
    </div>

    <iframe id="browserFrame" class="browser-area" src="about:blank"></iframe>

    <script>
        function loadPage() {
            let url = document.getElementById('urlInput').value;
            
            // Basic URL validation/formatting
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // Set the iframe source to the URL
            document.getElementById('browserFrame').src = url;
        }

        // Allow "Enter" key to search
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadPage();
            }
        });
    </script>
</body>
</html>
