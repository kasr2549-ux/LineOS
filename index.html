<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LineOS</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  color: white;

  background-image: url("ec5f377a267f9e999a5f4b13bd0fb102.gif");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  background-color: rgba(0,0,0,0.45);
  background-blend-mode: darken;
}

/* dark overlay */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.35);
}

/* top logo */
.topbar {
  position: relative;
  z-index: 2;
  text-align: center;
  padding-top: 40px;
}

.logo {
  font-size: 52px;
  font-weight: 600;
  letter-spacing: 6px;

  background: linear-gradient(90deg, #ffffff, #9ed8ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 0 20px rgba(255,255,255,0.3);
}

/* center content */
.center {
  position: relative;
  z-index: 2;

  height: 70vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* search bar */
.search-box {
  display: flex;
  width: 90%;
  max-width: 700px;
}

.search-box input {
  flex: 1;
  padding: 18px;

  border: none;
  outline: none;

  border-radius: 35px 0 0 35px;

  font-size: 17px;

  background: rgba(50,50,50,0.95);
  color: white;
}

.search-box input::placeholder {
  color: #cfcfcf;
}

.search-box button {
  padding: 18px 24px;

  border: none;

  border-radius: 0 35px 35px 0;

  background: #a8a8a8;
  color: black;

  font-weight: bold;
  cursor: pointer;

  transition: 0.2s;
}

.search-box button:hover {
  background: white;
}

/* apps section */
.apps {
  margin-top: 45px;

  display: grid;
  grid-template-columns: repeat(3, 110px);
  gap: 25px;
}

.app {
  width: 110px;
  height: 110px;

  border-radius: 24px;

  background: rgba(255,255,255,0.08);

  backdrop-filter: blur(6px);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition: 0.25s;
}

.app:hover {
  transform: scale(1.08);

  background: rgba(255,255,255,0.18);
}

.app-icon {
  font-size: 38px;
}

.app-name {
  margin-top: 10px;
  font-size: 13px;
}

/* footer */
.footer {
  position: absolute;
  bottom: 12px;

  width: 100%;
  text-align: center;

  font-size: 12px;
  opacity: 0.6;

  z-index: 2;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="topbar">
  <div class="logo">LineOS</div>
</div>

<div class="center">

  <!-- SEARCH BAR -->
  <div class="search-box">
    <input
      id="search"
      type="text"
      placeholder="Search Google..."
    />

    <button onclick="searchGoogle()">
      Search
    </button>
  </div>

  <!-- APPS -->
  <div class="apps">

    <div class="app" onclick="window.open('https://www.google.com', '_blank')">
      <div class="app-icon">🌐</div>
      <div class="app-name">Browser</div>
    </div>

    <div class="app" onclick="window.open('https://www.youtube.com', '_blank')">
      <div class="app-icon">▶️</div>
      <div class="app-name">YouTube</div>
    </div>

    <div class="app" onclick="window.open('https://docs.google.com', '_blank')">
      <div class="app-icon">📄</div>
      <div class="app-name">Docs</div>
    </div>

  </div>

</div>

<div class="footer">
  LineOS v3 • GitHub Pages
</div>

<script>

function searchGoogle() {

  let q = document.getElementById("search").value;

  if (!q) return;

  window.location.href =
    "https://www.google.com/search?q=" +
    encodeURIComponent(q);
}

document
  .getElementById("search")
  .addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
      searchGoogle();
    }

});

</script>

</body>
</html>
